[package]
name = "archer-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.28.2", features = ["extension-module", "abi3-py311"] }
ruff_python_parser = "=0.0.12"
ruff_python_ast = "=0.0.12"
ruff_text_size = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

stacker = "=0.1.25"
