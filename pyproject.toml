[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archer"
version = "0.1"
description = "Static Python architecture graphs, diagrams, context, and Git comparisons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["libcst>=1.5,<2", "networkx>=3.4,<4"]

[project.optional-dependencies]
render = []
semantic = ["pyright>=1.1.400,<2"]
all = ["archer[render,semantic]"]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "resvg-py>=0.5,<1", "pillow>=12,<13"]

[project.scripts]
archer = "archer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
